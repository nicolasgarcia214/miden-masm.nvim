name: Release Please

on:
  push:
    branches: [main]

# Release Please creates and labels its release PR, then creates the tag and
# GitHub release when that PR is merged.
permissions:
  contents: write
  issues: write
  pull-requests: write

# Do not let closely spaced pushes race while they update the same release PR.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A fine-grained token makes the generated PR run normal PR checks.
          # GITHUB_TOKEN is sufficient when that behavior is not required.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
